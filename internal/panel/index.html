<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>workbuddy2api-prime · 管理面板</title>
<style>
:root{--bg:#14161a;--card:#1d2026;--line:#2c313a;--tx:#dfe3e8;--dim:#8b93a1;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px;max-width:1200px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:22px 0 8px;color:var(--dim);font-weight:600}
.sub{color:var(--dim);font-size:12px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:600;font-size:12px}td.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.pill.ok{background:rgba(63,185,80,.15);color:var(--ok)}.pill.warn{background:rgba(210,153,34,.15);color:var(--warn)}.pill.bad{background:rgba(248,81,73,.15);color:var(--bad)}.pill.dim{background:rgba(139,147,161,.15);color:var(--dim)}
button{background:#2f81f7;border:0;color:#fff;border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer}
button:hover{background:#1f6feb}button.danger{background:#3a2426;color:var(--bad)}button.danger:hover{background:#4a2c2e}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
input,select{background:#0f1114;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:6px 10px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.stat{display:inline-block;min-width:130px}.stat b{font-size:20px;display:block}.stat span{color:var(--dim);font-size:12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c313a;padding:8px 18px;border-radius:6px;display:none}
.expire-soon{color:var(--warn);font-weight:600}
#keybar{background:#2a2113;border:1px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:flex-start;padding-top:8vh;z-index:10}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;width:520px;max-width:92vw}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button.ghost.on{border-color:var(--acc);color:var(--acc)}
textarea{width:100%;min-height:90px;background:#0f1114;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:8px 10px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.biglink{font-size:15px;word-break:break-all}
.step{color:var(--dim);font-size:12px;margin:6px 0}
</style>
</head>
<body>
<h1>workbuddy2api-prime</h1>
<div class="sub">管理面板 · 数据每 30 秒自动刷新 <button class="ghost" onclick="loadAll()">立即刷新</button></div>
<div id="keybar"><span>未设置管理密钥，接口将返回 401。</span>
<input id="adminKeyInput" type="password" placeholder="输入管理密钥" size="20" style="margin:0 8px">
<button onclick="saveAdminKey()">保存到浏览器</button></div>

<h2>账号池 <button onclick="openAddAccount()">添加账号</button></h2>
<div class="card"><table><thead><tr>
<th>账号</th><th>区域</th><th style="text-align:right">剩余额度</th><th>额度到期</th><th>状态</th><th style="text-align:right">连续失败</th><th style="text-align:right">EMA成本</th><th>上次选中</th>
</tr></thead><tbody id="accounts"><tr><td colspan="8" style="color:var(--dim)">加载中…</td></tr></tbody></table></div>

<h2>用量</h2>
<div class="card">
<div class="row">
<label>子钥匙 <input id="usageKey" placeholder="ID，空=全部" size="14"></label>
<label>范围 <select id="usageHours"><option value="1">近1小时</option><option value="24" selected>近24小时</option><option value="168">近7天</option></select></label>
<button onclick="loadUsage()">查询</button>
</div>
<div id="usageStats"></div>
</div>

<h2>签到历史</h2>
<div class="card"><table><thead><tr><th>时间</th><th>账号</th><th>结果</th><th>详情</th></tr></thead>
<tbody id="checkin"><tr><td colspan="4" style="color:var(--dim)">加载中…</td></tr></tbody></table></div>

<h2>定时任务</h2>
<div class="card"><div class="row" id="tasks">
<button onclick="runTask('checkin')">补跑签到</button>
<button onclick="runTask('keepalive')">补跑保活</button>
<button onclick="runTask('growth')">补跑成长任务</button>
<span class="sub" style="margin:0">任务名以服务端注册为准，失败会在下方提示</span>
</div></div>

<h2>子钥匙 <span class="sub">（wbk_，明文只在创建时显示一次）</span></h2>
<div class="card">
<div class="row"><input id="newKeyName" placeholder="钥匙名称" size="18"><button onclick="createKey()">新建</button></div>
<div id="newKeyPlain" class="mono" style="margin-bottom:8px"></div>
<table><thead><tr><th>ID</th><th>名称</th><th style="text-align:right">已用/配额</th><th>模型白名单</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="keys"><tr><td colspan="6" style="color:var(--dim)">加载中…</td></tr></tbody></table>
</div>

<div id="addAccountModal" class="modal"><div class="box">
<h2 style="margin-top:0">添加账号</h2>
<div class="tabs">
<button class="ghost on" id="tabDevice" onclick="showTab('device')">浏览器授权</button>
<button class="ghost" id="tabImport" onclick="showTab('import')">粘贴 Token</button>
</div>
<div id="paneDevice">
<div class="step">1. 选择版本，点击"获取授权链接"</div>
<div class="row"><select id="deviceRealm"><option value="cn">国内版</option><option value="global">国际版</option></select>
<button onclick="startDevice()">获取授权链接</button></div>
<div id="deviceLink" style="margin:10px 0"></div>
<div class="step" id="deviceStatus" style="display:none">2. 在浏览器打开上方链接完成登录，本页自动检测（每 3 秒）…</div>
</div>
<div id="paneImport" style="display:none">
<div class="step">把 access_token 等粘贴为 JSON（示例）：</div>
<textarea id="importJson" placeholder='{"access_token":"...","refresh_token":"...","uid":"...（可选，能自动反查）","region":"cn"}'></textarea>
<div class="row" style="margin-top:8px"><button onclick="importAccount()">导入</button></div>
</div>
<div class="row" style="margin-top:14px"><button class="ghost" onclick="closeAddAccount()">关闭</button></div>
</div></div>

<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function adminKey(){return localStorage.getItem('wb_admin_key')||''}
function saveAdminKey(){const v=$('adminKeyInput').value.trim();if(!v){toast('先输入密钥');return}localStorage.setItem('wb_admin_key',v);$('keybar').style.display='none';toast('已保存');loadAll()}
if(!adminKey()){$('keybar').style.display='block'}
async function api(path,opt){opt=opt||{};opt.headers=Object.assign({'Authorization':'Bearer '+adminKey()},opt.headers||{});const r=await fetch(path,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
// 添加账号弹窗
let pollTimer=null;
function openAddAccount(){$('addAccountModal').style.display='flex';showTab('device')}
function closeAddAccount(){$('addAccountModal').style.display='none';if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
function showTab(t){const d=t==='device';$('tabDevice').classList.toggle('on',d);$('tabImport').classList.toggle('on',!d);$('paneDevice').style.display=d?'block':'none';$('paneImport').style.display=d?'none':'block'}
async function startDevice(){
  try{
    const realm=$('deviceRealm').value;
    const j=await api('/panel/api/accounts/device/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({realm})});
    $('deviceLink').innerHTML=`<a class="biglink" href="${esc(j.auth_url)}" target="_blank" rel="noopener">${esc(j.auth_url)}</a>`;
    $('deviceStatus').style.display='block';
    if(pollTimer)clearInterval(pollTimer);
    pollTimer=setInterval(async()=>{
      try{
        const p=await api('/panel/api/accounts/device/poll?device_code='+encodeURIComponent(j.device_code));
        if(p.done){clearInterval(pollTimer);pollTimer=null;toast('账号添加成功：'+(p.account.uid||p.account.id));closeAddAccount();loadAccounts()}
      }catch(e){/* 轮询中 4xx/5xx 忽略，继续 */}
    },3000);
    toast('已发起授权，请在浏览器完成登录');
  }catch(e){toast(e.message)}
}
async function importAccount(){
  let body;try{body=JSON.parse($('importJson').value)}catch(e){toast('JSON 格式错误');return}
  try{
    const j=await api('/panel/api/accounts/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    toast('导入成功：'+(j.account.uid||j.account.id));closeAddAccount();loadAccounts();
  }catch(e){toast(e.message)}
}
function dt(s){if(!s)return '—';const d=new Date(s);return d.toLocaleString('zh-CN',{hour12:false})}
function daysLeft(s){if(!s)return '';const ms=new Date(s)-Date.now();if(ms<0)return '<span class="pill bad">已过期</span>';const d=Math.floor(ms/864e5);return d<=5?`<span class="expire-soon">剩 ${d} 天</span>`:`剩 ${d} 天`}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

async function loadAccounts(){
  try{
    const list=await api('/panel/api/accounts');
    $('accounts').innerHTML=list.length?list.map(a=>{
      const st=a.disabled?'<span class="pill bad">停用</span>':(a.cooldown_until&&new Date(a.cooldown_until)>new Date()?'<span class="pill warn">冷却中</span>':(a.degrade_until&&new Date(a.degrade_until)>new Date()?'<span class="pill warn">降级中</span>':'<span class="pill ok">正常</span>'));
      return `<tr><td class="mono">${esc(a.id)}</td><td>${esc(a.region)}</td><td class="num">${a.credit_total}</td><td>${daysLeft(a.credit_expires_at)}</td><td>${st}</td><td class="num">${a.fails}</td><td class="num">${(a.ema_cost||0).toFixed(2)}</td><td>${dt(a.last_pick)}</td></tr>`;
    }).join(''):'<tr><td colspan="8" style="color:var(--dim)">暂无账号</td></tr>';
  }catch(e){$('accounts').innerHTML=`<tr><td colspan="8" style="color:var(--bad)">${esc(e.message)}</td></tr>`}
}
async function loadUsage(){
  try{
    const key=$('usageKey').value.trim(),hours=$('usageHours').value;
    const s=await api(`/panel/api/usage?key=${encodeURIComponent(key)}&hours=${hours}`);
    $('usageStats').innerHTML=`<span class="stat"><b>${s.requests??0}</b><span>请求数</span></span>
      <span class="stat"><b>${s.prompt_tokens??0}</b><span>输入 token</span></span>
      <span class="stat"><b>${s.completion_tokens??0}</b><span>输出 token</span></span>
      <span class="stat"><b>${(s.total_credit??0).toFixed(1)}</b><span>消耗积分</span></span>`;
  }catch(e){toast(e.message)}
}
async function loadCheckin(){
  try{
    const list=await api('/panel/api/checkin');
    $('checkin').innerHTML=list.length?list.slice(0,50).map(c=>
      `<tr><td>${dt(c.time||c.Time)}</td><td class="mono">${esc(c.account_id||c.AccountID)}</td><td>${(c.ok??c.OK)?'<span class="pill ok">成功</span>':'<span class="pill bad">失败</span>'}</td><td>${esc(c.detail||c.Detail||'')}</td></tr>`
    ).join(''):'<tr><td colspan="4" style="color:var(--dim)">暂无记录</td></tr>';
  }catch(e){$('checkin').innerHTML=`<tr><td colspan="4" style="color:var(--bad)">${esc(e.message)}</td></tr>`}
}
async function loadKeys(){
  try{
    const list=await api('/panel/api/keys');
    $('keys').innerHTML=list.length?list.map(k=>{
      const quota=k.quota<0?'不限':k.quota;
      return `<tr><td class="mono">${esc(k.id)}</td><td>${esc(k.name)}</td><td class="num">${k.used} / ${quota}</td><td>${esc((k.models||[]).join(', ')||'全部')}</td><td>${k.disabled?'<span class="pill bad">停用</span>':'<span class="pill ok">启用</span>'}</td><td><button class="danger" onclick="delKey('${esc(k.id)}')">删除</button></td></tr>`;
    }).join(''):'<tr><td colspan="6" style="color:var(--dim)">暂无子钥匙</td></tr>';
  }catch(e){$('keys').innerHTML=`<tr><td colspan="6" style="color:var(--bad)">${esc(e.message)}</td></tr>`}
}
async function createKey(){
  const name=$('newKeyName').value.trim();if(!name){toast('先填名称');return}
  try{
    const j=await api('/panel/api/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
    $('newKeyPlain').innerHTML='新建成功，明文只显示一次：<b>'+esc(j.plain)+'</b>';
    $('newKeyName').value='';loadKeys();toast('子钥匙已创建');
  }catch(e){toast(e.message)}
}
async function delKey(id){
  if(!confirm('删除子钥匙 '+id+'？'))return;
  try{await api('/panel/api/keys/'+encodeURIComponent(id),{method:'DELETE'});loadKeys();toast('已删除')}catch(e){toast(e.message)}
}
async function runTask(name){
  try{await api('/panel/api/tasks/'+encodeURIComponent(name)+'/run',{method:'POST'});toast('任务已触发：'+name)}catch(e){toast(e.message)}
}
function loadAll(){loadAccounts();loadUsage();loadCheckin();loadKeys()}
loadAll();setInterval(loadAll,30000);
</script>
</body>
</html>
