<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初始化向导 · workbuddy2api-prime</title>
<style>
:root{--bg:#14161a;--card:#1d2026;--line:#2c313a;--tx:#dfe3e8;--dim:#8b93a1;--ok:#3fb950;--bad:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px;width:380px}
h1{font-size:18px;margin:0 0 6px}.sub{color:var(--dim);font-size:12px;margin-bottom:18px}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
input{width:100%;background:#0f1114;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:9px 12px;font-size:14px}
button{width:100%;background:#2f81f7;border:0;color:#fff;border-radius:6px;padding:10px;font-size:14px;cursor:pointer;margin-top:18px}
button:hover{background:#1f6feb}
.err{color:var(--bad);font-size:12px;min-height:18px;margin-top:8px}
.ok{color:var(--ok);font-size:13px;margin-top:8px}
a{color:#58a6ff}
</style>
</head>
<body>
<div class="card">
<h1>欢迎使用 workbuddy2api-prime</h1>
<div class="sub">首次运行：设置管理密钥（以后用它登录面板与调用 API）</div>
<label>管理密钥（至少 6 位）</label>
<input type="password" id="k1" autocomplete="new-password">
<label>再输入一次</label>
<input type="password" id="k2" autocomplete="new-password">
<div class="err" id="err"></div>
<button onclick="submit()">完成初始化</button>
<div class="ok" id="ok" style="display:none">设置成功！<a href="/panel/">进入管理面板 →</a><br><span style="color:var(--dim);font-size:12px">浏览器已记住该密钥（localStorage）</span></div>
</div>
<script>
async function submit(){
  const k1=document.getElementById('k1').value, k2=document.getElementById('k2').value;
  const err=document.getElementById('err'); err.textContent='';
  if(k1.length<6){err.textContent='密钥至少 6 位';return}
  if(k1!==k2){err.textContent='两次输入不一致';return}
  try{
    const r=await fetch('/panel/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k1,key2:k2})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    localStorage.setItem('wb_admin_key',k1);
    document.getElementById('ok').style.display='block';
  }catch(e){err.textContent=e.message}
}
</script>
</body>
</html>
