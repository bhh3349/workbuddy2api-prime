<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初始化向导 · workbuddy2api-prime</title>
<style>
:root,[data-theme="dark"]{--bg:#0f1114;--card:#1a1e25;--line:#2a303b;--line2:#353c49;--tx:#e6e9ee;--dim:#8b93a1;--acc:#6e9fff;--ok:#3fb950;--bad:#f85149}
[data-theme="light"]{--bg:#f2f4f7;--card:#ffffff;--line:#dfe4ea;--line2:#cdd4dd;--tx:#1b1e24;--dim:#5f6b7a;--acc:#2f6fed;--ok:#1a7f37;--bad:#cf222e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:30px;width:400px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.brand{font-weight:700;font-size:15px;margin-bottom:2px}
h1{font-size:18px;margin:0 0 6px}.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
input{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--tx);border-radius:7px;padding:9px 12px;font-size:14px}
input:focus{border-color:var(--acc);outline:none}
button{width:100%;background:var(--acc);border:0;color:#fff;border-radius:7px;padding:10px;font-size:14px;cursor:pointer;margin-top:18px}
button:hover{filter:brightness(1.1)}
.err{color:var(--bad);font-size:12px;min-height:18px;margin-top:8px}
.ok{color:var(--ok);font-size:13px;margin-top:8px}
a{color:var(--acc)}
.theme{position:fixed;top:14px;right:14px;background:var(--card);border:1px solid var(--line2);color:var(--tx);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;width:auto;margin:0}
</style>
</head>
<body>
<button class="theme" onclick="toggleTheme()">🌓 切换主题</button>
<div class="card">
<div class="brand">workbuddy2api-prime</div>
<h1>欢迎使用</h1>
<div class="sub">首次运行：设置管理密钥（以后用它登录面板与调用 API）</div>
<label>管理密钥（至少 6 位）</label>
<input type="password" id="k1" autocomplete="new-password">
<label>再输入一次</label>
<input type="password" id="k2" autocomplete="new-password">
<div class="err" id="err"></div>
<button onclick="submit()">完成初始化</button>
<div class="ok" id="ok"></div>
</div>
<script>
document.documentElement.dataset.theme=localStorage.getItem('wb_theme')||'dark';
function toggleTheme(){const c=document.documentElement.dataset.theme==='light'?'dark':'light';localStorage.setItem('wb_theme',c);document.documentElement.dataset.theme=c}
async function submit(){
  const k1=document.getElementById('k1').value,k2=document.getElementById('k2').value;
  const err=document.getElementById('err'),ok=document.getElementById('ok');
  err.textContent='';ok.textContent='';
  if(k1.length<6){err.textContent='密钥至少 6 位';return}
  if(k1!==k2){err.textContent='两次输入不一致';return}
  try{
    const r=await fetch('/panel/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k1,key2:k2})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    localStorage.setItem('wb_admin_key',k1);
    ok.textContent='初始化成功，正在进入面板…';
    setTimeout(()=>location.href='/panel/',900);
  }catch(e){err.textContent=e.message}
}
document.getElementById('k2').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
</script>
</body>
</html>
